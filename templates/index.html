<!DOCTYPE html>
<html>
<head>
    <title>Импорт данных</title>
</head>
<body>
    <h1>Импорт данных</h1>
    <form action="/" method="POST" enctype="multipart/form-data">
        <label>Выберите файл (CSV/JSON):</label><br>
        <input type="file" name="file" required><br><br>
        <label>Тема сортировки:</label><br>
        <input type="text" name="topic" placeholder="Например: технический канал?" required><br><br>
        <button type="submit">Загрузить</button>
    </form>
</body>
</html>
