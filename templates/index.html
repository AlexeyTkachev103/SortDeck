<!DOCTYPE html>
<html>
<head>
    <title>Импорт данных</title>
</head>
<body>
    <h1>Импорт данных</h1>
    <form action="/" method="POST" enctype="multipart/form-data">
    <label>Выберите файл (CSV/JSON):</label><br>
    <input type="file" name="file" required><br><br>

    <label>Тема сортировки:</label><br>
    <input type="text" name="topic" required><br><br>

    <label>Название колонки с изображением (если есть):</label><br>
    <input type="text" name="image_column" placeholder="Напр. ImageURL"><br><br>

    <button type="submit">Загрузить</button>
</form>

</body>
</html>
