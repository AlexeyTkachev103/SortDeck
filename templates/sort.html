<!DOCTYPE html>
<html>
<head>
    <title>Сортировка</title>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.addEventListener("keydown", (e) => {
                if (e.key === "ArrowLeft") swipe("left");
                if (e.key === "ArrowRight") swipe("right");
            });
        });

        function swipe(direction) {
            fetch(`/swipe/${direction}`, {
                method: "POST",
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ item: {{ item|tojson }} })
            }).then(() => {
                window.location.reload();
            });
        }
    </script>
</head>
<body>
    <h2>{{ topic }}</h2>
    <div class="card">
        {% if image_url %}
            <p><strong>{{ image_column }}:</strong></p>
            <img src="{{ image_url }}" alt="image">
        {% endif %}

        {% for key, value in item.items() %}
            {% if key != image_column %}
                <p><strong>{{ key }}:</strong><br> {{ value|replace('http', '<br>http')|safe }}</p>
            {% endif %}
        {% endfor %}
    </div>
    <p>{{ index }} из {{ total }}</p>
    <button onclick="swipe('left')">← Нет</button>
    <button onclick="swipe('right')">Да →</button>
</body>
</html>
